
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      const path = window.location.pathname;
      const base = '/P3I-Edukasi';
      const route = path.startsWith(base)
        ? path.slice(base.length)
        : path;

      sessionStorage.redirect = route + window.location.search + window.location.hash;
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
